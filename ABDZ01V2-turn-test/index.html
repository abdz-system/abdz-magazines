<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABDZ01 — Page Turn Test</title>
<link rel="icon" type="image/png" href="../ABDZ01/IMAGES/favicon.png">
<style>
*{box-sizing:border-box}
:root{
  --gold:#d6a94d;
  --gold-soft:rgba(214,169,77,.42);
  --panel:rgba(8,8,8,.78);
}
html,body{height:100%}
body{
  margin:0;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:radial-gradient(circle at 50% 35%, #342412 0%, #111 44%, #000 100%);
  color:#fff;
}
.viewer{
  position:fixed;
  inset:0;
  display:grid;
  grid-template-rows:1fr auto;
  padding:12px;
}
.stage{
  position:relative;
  display:grid;
  place-items:center;
  min-height:0;
  perspective:1800px;
}
.pages{
  position:relative;
  display:grid;
  place-items:center;
  width:100%;
  height:100%;
}
.pages.double-layout{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:18px;
}
.page{
  display:none;
  position:relative;
  min-width:0;
  min-height:0;
  transform-style:preserve-3d;
}
.page.active{
  display:grid;
  place-items:center;
}
.pages.double-layout .page.active{
  flex:0 1 min(46vw, calc(90svh * 0.714));
}
.page img{
  display:block;
  width:auto;
  height:auto;
  max-width:100%;
  max-height:88svh;
  object-fit:contain;
  object-position:center center;
  border-radius:10px;
  background:#000;
  box-shadow:0 18px 36px rgba(0,0,0,.38);
  backface-visibility:hidden;
  transform:translateZ(0);
}
.pages.double-layout .page img{
  max-height:90svh;
}
.page::after{
  content:"© ABDZ Creations®";
  position:absolute;
  right:10px;
  bottom:8px;
  font-size:10px;
  color:rgba(255,255,255,.48);
  pointer-events:none;
}
.turn-next .page.active img{
  animation:turnNext .42s cubic-bezier(.35,.02,.18,1) both;
  transform-origin:left center;
}
.turn-prev .page.active img{
  animation:turnPrev .42s cubic-bezier(.35,.02,.18,1) both;
  transform-origin:right center;
}
@keyframes turnNext{
  0%{opacity:.52; transform:rotateY(-16deg) translateX(18px) scale(.985); filter:brightness(.82)}
  100%{opacity:1; transform:rotateY(0) translateX(0) scale(1); filter:brightness(1)}
}
@keyframes turnPrev{
  0%{opacity:.52; transform:rotateY(16deg) translateX(-18px) scale(.985); filter:brightness(.82)}
  100%{opacity:1; transform:rotateY(0) translateX(0) scale(1); filter:brightness(1)}
}
.nav{
  position:absolute;
  top:50%;
  z-index:20;
  width:46px;
  height:58px;
  transform:translateY(-50%);
  border:1px solid rgba(238,198,113,.72);
  border-radius:999px;
  background:rgba(18,18,18,.72);
  color:#ffe7b1;
  font-size:34px;
  line-height:1;
  display:grid;
  place-items:center;
  box-shadow:0 0 24px rgba(214,169,77,.22);
  cursor:pointer;
}
.nav.prev{left:max(12px,env(safe-area-inset-left))}
.nav.next{right:max(12px,env(safe-area-inset-right))}
.controls{
  position:relative;
  z-index:12;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:12px;
  align-items:center;
  padding-top:8px;
}
.control-button,.page-number{
  border:1px solid var(--gold-soft);
  border-radius:999px;
  background:var(--panel);
  color:#f4e3bb;
  min-height:38px;
  padding:9px 14px;
  font-size:13px;
}
.control-button{
  cursor:pointer;
}
.page-number{
  min-width:168px;
  text-align:center;
}
@media (min-width:1024px){
  .viewer{padding:14px 72px 12px}
  .nav.prev{left:max(18px,calc(50% - min(46vw, calc(90svh * 0.714)) - 92px))}
  .nav.next{right:max(18px,calc(50% - min(46vw, calc(90svh * 0.714)) - 92px))}
}
@media (max-width:1023px){
  .viewer{padding:10px 10px 12px}
  .page.active{
    width:100%;
    height:100%;
  }
  .page img{
    max-width:96vw;
    max-height:84svh;
  }
  .nav{
    width:42px;
    height:52px;
    font-size:30px;
    background:rgba(18,18,18,.55);
  }
  .controls{
    grid-template-columns:1fr;
    justify-items:stretch;
  }
  .page-number{min-width:0}
}
</style>
</head>
<body>
<main class="viewer">
  <section class="stage" id="stage" aria-label="ABDZ Magazine page-turn test">
    <div class="pages" id="pagesContainer"></div>
    <button class="nav prev" type="button" onclick="prevPage()" aria-label="Page précédente">‹</button>
    <button class="nav next" type="button" onclick="nextPage()" aria-label="Page suivante">›</button>
  </section>
  <footer class="controls">
    <button class="control-button" type="button" onclick="prevPage()">Page précédente</button>
    <div class="page-number" id="pageNumber"></div>
    <button class="control-button" type="button" onclick="nextPage()">Page suivante</button>
  </footer>
</main>
<script>
const FIRST_NUMBERED_FILE = 2;
const NUMBER_OF_NUMBERED_PAGES = 160;
const PANORAMA_PAGES = [12,31,52,83,88,93,110,113,114,118,119,128,133,146,157];
const imageList = [
  "couverture.png",
  ...Array.from({ length: NUMBER_OF_NUMBERED_PAGES }, (_, i) => `${FIRST_NUMBERED_FILE + i}.png`),
  "derniere-couverture.png"
];
const pagesContainer = document.getElementById("pagesContainer");
const pageNumber = document.getElementById("pageNumber");
const stage = document.getElementById("stage");
let currentPage = 0;
let touchStartX = 0;
let touchEndX = 0;
let isTurning = false;

imageList.forEach((fileName, index) => {
  const page = document.createElement("div");
  page.className = "page";
  const displayNumber = index + 1;
  if (PANORAMA_PAGES.includes(displayNumber)) page.dataset.panorama = "true";
  const img = document.createElement("img");
  img.src = `../ABDZ01/IMAGES/${fileName}`;
  img.alt = fileName;
  img.loading = index < 6 ? "eager" : "lazy";
  img.decoding = "async";
  img.draggable = false;
  page.appendChild(img);
  pagesContainer.appendChild(page);
});

const pages = Array.from(document.querySelectorAll(".page"));
const isDesktop = () => window.innerWidth >= 1024;
const isPanorama = index => pages[index]?.dataset?.panorama === "true";
const isCover = index => index === 0;
const isLastCover = index => index === imageList.length - 1;
function canPair(index){
  if (!isDesktop()) return false;
  if (index < 0 || index >= pages.length) return false;
  if (isCover(index) || isLastCover(index) || isPanorama(index)) return false;
  const nextIndex = index + 1;
  if (nextIndex >= pages.length) return false;
  if (isLastCover(nextIndex) || isPanorama(nextIndex)) return false;
  return true;
}
function getLabel(index){
  if (isCover(index)) return "Couverture";
  if (isLastCover(index)) return "Dernière couverture";
  return `Page ${index + 1}`;
}
function render(direction = 0){
  pages.forEach(page => page.classList.remove("active"));
  pagesContainer.classList.remove("double-layout","turn-next","turn-prev");
  if (!pages[currentPage]) return;
  if (direction > 0) pagesContainer.classList.add("turn-next");
  if (direction < 0) pagesContainer.classList.add("turn-prev");
  if (isDesktop() && canPair(currentPage)) {
    pages[currentPage].classList.add("active");
    pages[currentPage + 1].classList.add("active");
    pagesContainer.classList.add("double-layout");
    pageNumber.textContent = `Pages ${currentPage + 1}-${currentPage + 2} / ${pages.length}`;
  } else {
    pages[currentPage].classList.add("active");
    pageNumber.textContent = `${getLabel(currentPage)} / ${pages.length}`;
  }
  clearTimeout(isTurning);
  isTurning = setTimeout(() => pagesContainer.classList.remove("turn-next","turn-prev"), 460);
}
function nextPage(){
  currentPage += isDesktop() && canPair(currentPage) ? 2 : 1;
  if (currentPage >= pages.length) {
    window.location.href = "intro.html?mode=outro";
    return;
  }
  render(1);
}
function prevPage(){
  if (isDesktop()) {
    const previousStart = currentPage - 2;
    if (currentPage <= 0) currentPage = 0;
    else if (previousStart >= 0 && canPair(previousStart)) currentPage = previousStart;
    else currentPage -= 1;
  } else {
    currentPage -= 1;
  }
  if (currentPage < 0) currentPage = 0;
  render(-1);
}
document.addEventListener("touchstart", e => { touchStartX = e.changedTouches[0].screenX; }, {passive:true});
document.addEventListener("touchend", e => {
  touchEndX = e.changedTouches[0].screenX;
  if (touchEndX < touchStartX - 50) nextPage();
  if (touchEndX > touchStartX + 50) prevPage();
}, {passive:true});
document.addEventListener("keydown", event => {
  if (event.key === "ArrowRight") nextPage();
  if (event.key === "ArrowLeft") prevPage();
});
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("dragstart", e => e.preventDefault());
window.addEventListener("resize", () => render());
render();
</script>
</body>
</html>
