<!DOCTYPE html>
<html lang="fr">
<head>
<meta name="google-site-verification" content="Rb-8OLqvgLhfROJCLWWktbUOBynFP2xPQkvSY2QVLFY" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LE MEURICE — Ouverture / Fermeture</title>

<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-NDSKCC1H3E');

<style>
  *{box-sizing:border-box;}

  body{
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
    color:white;
    background:radial-gradient(circle at top,#3a2d1a 0%,#000 70%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
  }

  .container{
    max-width:900px;
    width:100%;
    padding:20px;
  }

  h1{
    font-size:30px;
    margin-bottom:6px;
    letter-spacing:1px;
  }

  p.sous-titre{
    font-size:18px;
    line-height:1.4;
    opacity:0.95;
    margin-bottom:10px;
    font-weight:300;
  }

  p.helper{
    font-size:15px;
    color:#e7c980;
    margin-bottom:18px;
    font-weight:500;
    letter-spacing:0.3px;
    min-height:18px;
  }

  .video-wrapper{
    margin:0 auto 18px auto;
    max-width:800px;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(0,0,0,0.5);
    background:#000;
  }

  video{
    width:100%;
    display:block;
    background:#000;
    max-height:70vh;
  }

  video::-webkit-media-controls-start-playback-button {
    display:none !important;
    -webkit-appearance:none;
  }

  video::-webkit-media-controls-overlay-play-button {
    display:none !important;
  }

  video::-webkit-media-controls-play-button {
    display:none !important;
  }

  a.cta{
    display:inline-block;
    margin-top:8px;
    padding:14px 28px;
    background:#b48b43;
    color:white;
    font-size:20px;
    border-radius:999px;
    text-decoration:none;
    transition:0.3s;
    box-shadow:0 8px 22px rgba(0,0,0,0.4);
    letter-spacing:0.5px;
    font-weight:500;
    text-transform:uppercase;
  }

  a.cta:hover{
    background:#d4a64d;
    transform:translateY(-3px);
  }

  .hidden{
    display:none !important;
  }

  @media (max-width:768px){
    .container{
      padding:18px;
    }

    h1{
      font-size:24px;
    }

    p.sous-titre{
      font-size:16px;
    }

    p.helper{
      font-size:14px;
    }

    a.cta{
      font-size:17px;
      padding:12px 22px;
    }

    video{
      max-height:62vh;
    }
  }
</style>
</head>

<body>
<div class="container">
  <h1 id="mainTitle">LE MEURICE — PRÉLUDE</h1>
  <p class="sous-titre" id="subTitle">Une interprétation éditoriale inspirée du lieu</p>
  <p class="helper" id="helperText"></p>

  <div class="video-wrapper">
    <video
      id="mainVideo"
      controls
      playsinline
      webkit-playsinline
      preload="metadata"
      poster="VIDEOS/intro-poster.png">
      <source id="videoSource" src="VIDEOS/intro.mp4" type="video/mp4">
      Votre navigateur ne peut pas lire cette vidéo.
    </video>
  </div>

  <a class="cta" id="actionBtn" href="index.html">ENTRER</a>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const mode = params.get("mode");

  const mainTitle = document.getElementById("mainTitle");
  const subTitle = document.getElementById("subTitle");
  const helperText = document.getElementById("helperText");
  const video = document.getElementById("mainVideo");
  const source = document.getElementById("videoSource");
  const btn = document.getElementById("actionBtn");

  if (mode === "outro") {
    mainTitle.textContent = "LE MEURICE — FERMETURE";
    subTitle.textContent = "Merci d’avoir parcouru l’univers éditorial du Meurice.";
    helperText.textContent = "";
    source.src = "VIDEOS/fin.mp4";
    video.setAttribute("poster", "VIDEOS/fin-poster.png");
    video.muted = true;
    video.setAttribute("muted", "muted");
    btn.textContent = "ENTRER DANS LA GALERIE";
    btn.href = "transition.html";
    btn.classList.remove("hidden");
    video.load();

    video.addEventListener("loadeddata", () => {
      video.play().catch(() => {});
    }, { once: true });

  } else {
    mainTitle.textContent = "LE MEURICE — PRÉLUDE";
    subTitle.textContent = "Une interprétation éditoriale inspirée du lieu";
    helperText.textContent = "";
    source.src = "VIDEOS/intro.mp4";
    video.setAttribute("poster", "VIDEOS/intro-poster.png");
    video.muted = false;
    video.removeAttribute("muted");
    btn.textContent = "CLIQUEZ";
    btn.href = "#";
    video.load();

    btn.onclick = function(e){
      e.preventDefault();
      video.play().catch(() => {});
      btn.classList.add("hidden");
    };

    video.addEventListener("ended", function(){
      btn.textContent = "ENTRER";
      btn.href = "index.html";
      btn.onclick = null;
      btn.classList.remove("hidden");
    }, { once: true });
  }
</script>
</body>
</html>
