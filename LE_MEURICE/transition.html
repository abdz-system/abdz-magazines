<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LE MEURICE — Galerie des muses</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:#fff;
    background:radial-gradient(circle at top,#3a2d1a 0%,#111 45%,#000 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
  }

  .wrap{
    max-width:900px;
    width:100%;
    background:rgba(20,20,20,0.92);
    border:1px solid rgba(212,166,77,0.25);
    border-radius:24px;
    padding:42px 28px;
    box-shadow:0 14px 40px rgba(0,0,0,0.35);
    backdrop-filter:blur(6px);
  }

  h1{
    margin:0 0 18px 0;
    font-family:"Playfair Display", serif;
    font-size:40px;
    font-weight:600;
    letter-spacing:1px;
    color:#fff;
  }

  p{
    margin:0 auto 14px auto;
    max-width:700px;
    line-height:1.7;
    font-size:18px;
    color:rgba(255,255,255,0.92);
  }

  .cta{
    display:inline-block;
    margin-top:26px;
    padding:14px 28px;
    background:#b48b43;
    color:white;
    font-size:18px;
    border-radius:999px;
    text-decoration:none;
    transition:0.3s;
    box-shadow:0 8px 22px rgba(0,0,0,0.4);
    letter-spacing:0.5px;
    font-weight:500;
    text-transform:uppercase;
  }

  .cta:hover{
    background:#d4a64d;
    transform:translateY(-3px);
  }

  @media (max-width:768px){
    .wrap{
      padding:30px 20px;
      border-radius:18px;
    }

    h1{
      font-size:28px;
    }

    p{
      font-size:16px;
      line-height:1.6;
    }

    .cta{
      font-size:16px;
      padding:12px 22px;
    }
  }
</style>
</head>

<body>
  <div class="wrap">
    <h1>UNE PREMIÈRE SÉLECTION DE MUSES</h1>

    <p>Ces muses constituent une première base éditoriale.</p>

    <p>
      Chacune peut être réinterprétée, adaptée ou déplacée selon l’identité du lieu,
      du projet ou de l’univers souhaité.
    </p>

    <p>Cette galerie propose une première sélection à découvrir.</p>

    <a class="cta" href="galerie.html">ENTRER DANS LA GALERIE</a>
  </div>
</body>
</html>
