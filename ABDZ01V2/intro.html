<style>
  body{
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
    color:white;
    background:radial-gradient(circle at top,#3a2d1a 0%,#000 70%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
  }

  .container{
    max-width:900px;
    padding:20px;
  }

  h1{
    font-size:30px;
    margin-bottom:6px;
    letter-spacing:1px;
  }

  p.sous-titre{
    font-size:18px;
    line-height:1.4;
    opacity:0.95;
    margin-bottom:6px;
    font-weight:300;
  }

  /* ✨ TEXTE AIDE */
  p.helper{
    font-size:15px;
    color:#e7c980;
    margin-bottom:18px;
    font-weight:500;
    letter-spacing:0.3px;
  }

  .video-wrapper{
    margin:0 auto 18px auto;
    max-width:800px;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(0,0,0,0.5);
  }

  video{
    width:100%;
    display:block;
    background:#000;
    max-height:70vh;
  }

  a.cta{
    display:inline-block;
    margin-top:8px;
    padding:14px 28px;
    background:#b48b43;
    color:white;
    font-size:20px;
    border-radius:999px;
    text-decoration:none;
    transition:0.3s;
    box-shadow:0 8px 22px rgba(0,0,0,0.4);
    letter-spacing:0.5px;
    font-weight:500;
    text-transform:uppercase;
  }

  a.cta:hover{
    background:#d4a64d;
    transform:translateY(-3px);
  }
</style>
</head>

<body>
<div class="container">
  <h1 id="mainTitle">ABDZ — PORTE D’OUVERTURE</h1>
  <p class="sous-titre" id="subTitle">Une porte d’entrée vers l’univers éditorial ABDZ.</p>

  <!-- ✨ TEXTE AIDE -->
  <p class="helper" id="helperText">Cliquez sur la vidéo pour entrer.</p>

  <div class="video-wrapper">
    <video id="mainVideo" controls playsinline>
      <source id="videoSource" src="../ABDZ01/VIDEOS/intro.mp4" type="video/mp4">
      Votre navigateur ne peut pas lire cette vidéo.
    </video>
  </div>

  <a class="cta" id="actionBtn" href="index.html">ENTRER DANS LE MAGAZINE</a>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const mode = params.get("mode");

  const mainTitle = document.getElementById("mainTitle");
  const subTitle = document.getElementById("subTitle");
  const helperText = document.getElementById("helperText");
  const video = document.getElementById("mainVideo");
  const source = document.getElementById("videoSource");
  const btn = document.getElementById("actionBtn");

  if (mode === "outro") {
    mainTitle.textContent = "ABDZ — FERMETURE";
    subTitle.textContent = "Merci d’avoir parcouru l’univers ABDZ.";
    helperText.textContent = "Cliquez sur la vidéo pour la lancer.";
    source.src = "../ABDZ01/VIDEOS/cloture.mp4";
    btn.textContent = "REVOIR L’OUVERTURE";
    btn.href = "intro.html";
  } else {
    mainTitle.textContent = "ABDZ — PORTE D’OUVERTURE";
    subTitle.textContent = "Une porte d’entrée vers l’univers éditorial ABDZ.";
    helperText.textContent = "Cliquez sur la vidéo pour entrer.";
    source.src = "../ABDZ01/VIDEOS/intro.mp4";
    btn.textContent = "ENTRER DANS LE MAGAZINE";
    btn.href = "index.html";
  }

  video.load();
</script>
</body>
</html>
