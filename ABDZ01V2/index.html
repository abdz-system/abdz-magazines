<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABDZ Magazine</title>
<link rel="icon" type="image/png" href="../ABDZ01/IMAGES/favicon.png">
<style>
*{box-sizing:border-box}
:root{
  --gold:#d6a94d;
  --gold-strong:#ffd782;
  --gold-soft:rgba(214,169,77,.42);
  --panel:rgba(8,8,8,.78);
}
html,body{height:100%}
body{
  margin:0;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 50% 38%, rgba(108,72,28,.38), transparent 34%),
    radial-gradient(circle at 50% 100%, rgba(214,169,77,.09), transparent 36%),
    linear-gradient(115deg,#030303 0%,#15110a 45%,#050505 100%);
  color:#fff;
}
.viewer{
  position:fixed;
  inset:0;
  display:grid;
  grid-template-rows:1fr auto;
  padding:12px;
}
.stage{
  position:relative;
  display:grid;
  place-items:center;
  min-height:0;
  perspective:2100px;
  overflow:hidden;
}
.stage::before{
  content:"";
  position:absolute;
  inset:5% 15%;
  background:radial-gradient(circle, rgba(214,169,77,.18), transparent 62%);
  filter:blur(18px);
  pointer-events:none;
}
.pages{
  position:relative;
  z-index:2;
  display:grid;
  place-items:center;
  width:100%;
  height:100%;
}
.pages.double-layout{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:2px;
  filter:drop-shadow(0 26px 38px rgba(0,0,0,.48));
}
.pages.double-layout::after{
  content:"";
  position:absolute;
  z-index:8;
  top:4%;
  bottom:4%;
  left:50%;
  width:18px;
  transform:translateX(-50%);
  background:linear-gradient(90deg,transparent,rgba(0,0,0,.30) 48%,rgba(255,255,255,.08) 52%,transparent);
  pointer-events:none;
}
.page{
  display:none;
  position:relative;
  min-width:0;
  min-height:0;
  transform-style:preserve-3d;
}
.page.active{
  display:grid;
  place-items:center;
}
.pages.double-layout .page.active{
  flex:0 1 min(46vw, calc(90svh * 0.714));
}
.page img{
  display:block;
  width:auto;
  height:auto;
  max-width:100%;
  max-height:88svh;
  object-fit:contain;
  object-position:center center;
  border-radius:6px;
  background:#000;
  box-shadow:0 20px 42px rgba(0,0,0,.42), 0 0 18px rgba(214,169,77,.12);
  backface-visibility:hidden;
  transform:translateZ(0);
}
.pages.double-layout .page img{
  max-height:90svh;
}
.pages.double-layout .page:first-of-type img{border-radius:6px 1px 1px 6px}
.pages.double-layout .page:last-of-type img{border-radius:1px 6px 6px 1px}
.page::after{
  content:"\00A9 ABDZ Creations\00AE";
  position:absolute;
  right:10px;
  bottom:8px;
  font-size:10px;
  color:rgba(255,255,255,.48);
  pointer-events:none;
}
.turn-layer{
  position:fixed;
  inset:0;
  z-index:14;
  pointer-events:none;
  perspective:2100px;
}
.turn-copy{
  position:fixed;
  object-fit:contain;
  border-radius:10px;
  background:#000;
  box-shadow:0 28px 58px rgba(0,0,0,.55), 0 0 34px rgba(214,169,77,.22);
  transform-style:preserve-3d;
  backface-visibility:hidden;
}
.turn-copy.next{
  transform-origin:left center;
  animation:pageLeaveNext .72s cubic-bezier(.2,.62,.18,1) both;
}
.turn-copy.prev{
  transform-origin:right center;
  animation:pageLeavePrev .72s cubic-bezier(.2,.62,.18,1) both;
}
.incoming-next .page.active img{
  animation:pageArriveNext .48s cubic-bezier(.25,.06,.18,1) both;
}
.incoming-prev .page.active img{
  animation:pageArrivePrev .48s cubic-bezier(.25,.06,.18,1) both;
}
@keyframes pageLeaveNext{
  0%{opacity:1; transform:rotateY(0) translateX(0) scale(1); filter:brightness(1)}
  45%{opacity:.94; transform:rotateY(-52deg) translateX(-10px) scale(.992); filter:brightness(.72)}
  100%{opacity:0; transform:rotateY(-118deg) translateX(-58px) scale(.97); filter:brightness(.42)}
}
@keyframes pageLeavePrev{
  0%{opacity:1; transform:rotateY(0) translateX(0) scale(1); filter:brightness(1)}
  45%{opacity:.94; transform:rotateY(52deg) translateX(10px) scale(.992); filter:brightness(.72)}
  100%{opacity:0; transform:rotateY(118deg) translateX(58px) scale(.97); filter:brightness(.42)}
}
@keyframes pageArriveNext{
  0%{opacity:.58; transform:translateX(22px) scale(.985); filter:brightness(.72)}
  100%{opacity:1; transform:translateX(0) scale(1); filter:brightness(1)}
}
@keyframes pageArrivePrev{
  0%{opacity:.58; transform:translateX(-22px) scale(.985); filter:brightness(.72)}
  100%{opacity:1; transform:translateX(0) scale(1); filter:brightness(1)}
}
.nav{
  position:absolute;
  top:50%;
  z-index:24;
  width:48px;
  height:60px;
  transform:translateY(-50%);
  border:1px solid rgba(255,215,130,.78);
  border-radius:999px;
  background:rgba(18,18,18,.70);
  color:#ffe7b1;
  font-size:34px;
  line-height:1;
  display:grid;
  place-items:center;
  box-shadow:0 0 25px rgba(214,169,77,.26), inset 0 0 16px rgba(255,230,170,.08);
  cursor:pointer;
}
.nav:hover{
  background:rgba(54,35,12,.84);
  box-shadow:0 0 32px rgba(255,210,120,.36), inset 0 0 16px rgba(255,230,170,.12);
}
.nav.prev{left:max(12px,env(safe-area-inset-left))}
.nav.next{right:max(12px,env(safe-area-inset-right))}
.controls{
  position:relative;
  z-index:12;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  padding-top:8px;
}
.page-number{
  border:1px solid var(--gold-soft);
  border-radius:999px;
  background:var(--panel);
  color:#f4e3bb;
  min-height:38px;
  padding:9px 18px;
  font-size:13px;
  min-width:168px;
  text-align:center;
}
.progress-track{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:40;
  height:3px;
  background:rgba(255,255,255,.08);
}
.progress-bar{
  display:block;
  width:0;
  height:100%;
  background:linear-gradient(90deg,#8e5b15,var(--gold-strong));
  box-shadow:0 0 14px rgba(255,215,130,.72);
  transition:width .35s ease;
}
.icon-button{
  position:relative;
  overflow:hidden;
  width:38px;
  height:34px;
  border:1px solid rgba(214,169,77,.52);
  border-radius:999px;
  background:rgba(9,7,4,.66);
  color:#f7df99;
  display:inline-grid;
  place-items:center;
  cursor:pointer;
  font-size:15px;
  transition:transform .22s ease,background .22s ease,color .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.icon-button:hover,.icon-button[aria-expanded="true"]{
  background:rgba(214,169,77,.18);
  color:#fff5c9;
  border-color:rgba(255,215,130,.9);
  box-shadow:0 0 22px rgba(214,169,77,.28);
  transform:translateY(-2px) scale(1.025);
}
.icon-button:active{transform:translateY(0) scale(.97)}
.tool-button{
  width:auto;
  min-width:104px;
  padding:0 14px;
  gap:8px;
  grid-auto-flow:column;
  font-size:12px;
  letter-spacing:.09em;
  text-transform:uppercase;
  animation:controlBreath 3.6s ease-in-out infinite;
}
.tool-button .tool-icon{font-size:15px;transition:transform .25s ease}
.tool-button .tool-label{font:700 9px/1 Arial,sans-serif;letter-spacing:.12em}
.tool-button:hover .tool-icon{transform:scale(1.18) rotate(-4deg)}
.tool-button::after{
  content:"";
  position:absolute;
  top:-35%;
  bottom:-35%;
  left:-45%;
  width:28%;
  background:linear-gradient(90deg,transparent,rgba(255,236,187,.35),transparent);
  transform:skewX(-18deg);
  transition:left .55s ease;
}
.tool-button:hover::after{left:120%}
#fullscreenButton{animation-delay:1.1s}
@keyframes controlBreath{
  0%,100%{box-shadow:0 0 10px rgba(214,169,77,.08)}
  50%{box-shadow:0 0 21px rgba(214,169,77,.20)}
}
.overview{
  position:fixed;
  inset:0;
  z-index:70;
  display:grid;
  grid-template-rows:auto 1fr;
  padding:clamp(18px,4vw,48px);
  background:rgba(2,2,2,.94);
  backdrop-filter:blur(16px);
  opacity:0;
  visibility:hidden;
  transition:opacity .25s ease,visibility .25s ease;
}
.overview.open{opacity:1;visibility:visible}
.overview-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}
.overview-title{margin:0;color:#fff3cf;font:400 clamp(22px,3vw,40px)/1 Georgia,serif;letter-spacing:.04em}
.overview-tools{display:flex;align-items:center;gap:10px;margin-left:auto}
.overview-search{
  width:min(260px,42vw);
  height:36px;
  border:1px solid rgba(214,169,77,.42);
  border-radius:999px;
  padding:0 16px;
  background:rgba(255,255,255,.06);
  color:#fff3cf;
  outline:none;
  font:12px Arial,sans-serif;
}
.overview-search:focus{border-color:var(--gold-strong);box-shadow:0 0 18px rgba(214,169,77,.2)}
.overview-search::placeholder{color:rgba(255,243,207,.48)}
.overview-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(112px,1fr));
  gap:16px;
  overflow:auto;
  overscroll-behavior:contain;
  padding:4px 4px 30px;
}
.thumb{
  appearance:none;
  border:1px solid rgba(214,169,77,.25);
  border-radius:8px;
  padding:6px;
  background:#111;
  color:#d9c28e;
  cursor:pointer;
  text-align:left;
}
.thumb:hover,.thumb.current{border-color:var(--gold-strong);box-shadow:0 0 22px rgba(214,169,77,.24)}
.thumb img{display:block;width:100%;aspect-ratio:5/7;object-fit:cover;background:#050505;border-radius:4px}
.thumb span{display:block;margin-top:6px;font:10px/1.3 Arial,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loading{
  position:fixed;
  inset:0;
  z-index:90;
  display:grid;
  place-items:center;
  background:#050403;
  color:#f3deb0;
  font:11px/1 Arial,sans-serif;
  letter-spacing:.22em;
  text-transform:uppercase;
  transition:opacity .4s ease,visibility .4s ease;
}
.loading.hidden{opacity:0;visibility:hidden}

@media (min-width:1024px){
  .viewer{padding:14px 72px 12px}
  .nav.prev{left:max(18px,calc(50% - min(46vw, calc(90svh * 0.714)) - 92px))}
  .nav.next{right:max(18px,calc(50% - min(46vw, calc(90svh * 0.714)) - 92px))}
}
@media (max-width:1023px){
  .viewer{padding:10px 10px 12px}
  .page.active{
    width:100%;
    height:100%;
  }
  .page img{
    max-width:96vw;
    max-height:84svh;
  }
  .nav{
    width:42px;
    height:52px;
    font-size:30px;
    background:rgba(18,18,18,.56);
  }
  .overview{padding:18px 12px}
  .overview-head{align-items:flex-start;flex-wrap:wrap}
  .overview-tools{width:100%;order:3;margin-left:0}
  .overview-search{width:100%}
  .overview-grid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
}
@media (max-width:560px){
  .controls{gap:6px}
  .page-number{min-width:118px;padding-inline:12px}
  .tool-button{width:38px;min-width:38px;padding:0;gap:0}
  .tool-button .tool-label{display:none}
}
.sound-toggle{
  width:42px;
  height:34px;
  border:1px solid rgba(214,169,77,.72);
  border-radius:999px;
  background:rgba(9,7,4,.66);
  color:#f7df99;
  font-size:16px;
  line-height:1;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 20px rgba(214,169,77,.18);
  cursor:pointer;
}
.sound-toggle.is-on{
  background:rgba(214,169,77,.18);
  color:#fff5c9;
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
.portfolio-return{
  position:fixed;
  top:max(14px,env(safe-area-inset-top));
  right:max(14px,env(safe-area-inset-right));
  z-index:60;
  display:inline-flex;
  align-items:center;
  gap:8px;
  border:1px solid rgba(255,215,130,.85);
  border-radius:999px;
  padding:11px 16px;
  color:#fff3cf;
  background:rgba(8,7,5,.9);
  box-shadow:0 0 24px rgba(214,169,77,.24);
  font:700 11px/1 Arial,sans-serif;
  letter-spacing:.08em;
  text-decoration:none;
  text-transform:uppercase;
  backdrop-filter:blur(8px);
}
.portfolio-return:hover{background:rgba(70,45,14,.94)}
@media (max-width:700px){
  .portfolio-return{top:8px;right:8px;padding:9px 12px;font-size:9px}
}
</style>
</head>
<body>
<div class="loading" id="loading" role="status">Ouverture du magazine</div>
<a class="portfolio-return" id="portfolioReturn" href="intro.html?mode=outro" aria-label="Fermer le magazine">✕ Fermer le magazine</a>
<audio id="ambientMusicA" src="../ABDZ01/AUDIOS/abdz-music.mp3" preload="auto"></audio>
<audio id="ambientMusicB" src="../ABDZ01/AUDIOS/abdz-music.mp3" preload="auto"></audio>
<main class="viewer">
  <section class="stage" id="stage" aria-label="ABDZ Magazine page-turn vivant">
    <div class="pages" id="pagesContainer"></div>
    <div class="turn-layer" id="turnLayer" aria-hidden="true"></div>
    <button class="nav prev" type="button" onclick="prevPage()" aria-label="Page precedente">&#10094;</button>
    <button class="nav next" type="button" onclick="nextPage()" aria-label="Page suivante">&#10095;</button>
  </section>
  <footer class="controls">
    <button class="icon-button tool-button" id="overviewButton" type="button" aria-label="Ouvrir la mosaïque des pages" aria-expanded="false"><span class="tool-icon" aria-hidden="true">▦</span><span class="tool-label">Mosaïque</span></button>
    <div class="page-number" id="pageNumber" aria-live="polite"></div>
    <button class="sound-toggle" id="soundToggle" type="button" aria-label="Activer la musique">&#128263;</button>
    <button class="icon-button tool-button" id="fullscreenButton" type="button" aria-label="Agrandir en plein écran"><span class="tool-icon" aria-hidden="true">⛶</span><span class="tool-label">Agrandir</span></button>
  </footer>
</main>
<div class="progress-track" aria-hidden="true"><span class="progress-bar" id="progressBar"></span></div>
<aside class="overview" id="overview" aria-hidden="true" aria-label="Toutes les pages du magazine">
  <div class="overview-head">
    <h2 class="overview-title">ABDZ — Toutes les pages</h2>
    <div class="overview-tools">
      <input class="overview-search" id="overviewSearch" type="search" inputmode="numeric" placeholder="Aller à une page…" aria-label="Rechercher une page">
      <button class="icon-button" id="overviewClose" type="button" aria-label="Fermer l’aperçu">✕</button>
    </div>
  </div>
  <div class="overview-grid" id="overviewGrid"></div>
</aside>
<script>
const magazineParams = new URLSearchParams(window.location.search);
const magazineFrom = magazineParams.get("from");
const portfolioReturn = document.getElementById("portfolioReturn");
portfolioReturn.addEventListener("click", event => {
  if (magazineFrom !== "unreal-girl") return;
  event.preventDefault();
  window.close();
  window.setTimeout(() => {
    portfolioReturn.textContent = "FERMEZ CET ONGLET POUR REVENIR";
  }, 180);
});
const musicTracks = [
  document.getElementById("ambientMusicA"),
  document.getElementById("ambientMusicB")
];
const soundToggle = document.getElementById("soundToggle");
const MUSIC_VOLUME = 0.28;
const CROSSFADE_SECONDS = 0.75;
let activeTrack = 0;
let musicOn = false;
let loopTimer = null;
musicTracks.forEach(track => {
  track.volume = 0;
  track.preload = "auto";
  track.addEventListener("ended", () => startNextTrack());
});
function setSoundButton(isOn){
  soundToggle.innerHTML = isOn ? "&#128266;" : "&#128263;";
  soundToggle.classList.toggle("is-on", isOn);
  soundToggle.setAttribute("aria-label", isOn ? "Couper la musique" : "Activer la musique");
}
function fadeTracks(fromTrack, toTrack){
  const start = performance.now();
  const duration = CROSSFADE_SECONDS * 1000;
  function step(now){
    const progress = Math.min((now - start) / duration, 1);
    if (fromTrack) fromTrack.volume = MUSIC_VOLUME * (1 - progress);
    toTrack.volume = MUSIC_VOLUME * progress;
    if (progress < 1 && musicOn) {
      requestAnimationFrame(step);
    } else if (fromTrack) {
      fromTrack.pause();
      fromTrack.currentTime = 0;
      toTrack.volume = MUSIC_VOLUME;
    }
  }
  requestAnimationFrame(step);
}
function scheduleMusicLoop(){
  clearTimeout(loopTimer);
  const track = musicTracks[activeTrack];
  if (!musicOn) return;
  if (!Number.isFinite(track.duration) || track.duration <= CROSSFADE_SECONDS + 0.5) {
    loopTimer = setTimeout(scheduleMusicLoop, 300);
    return;
  }
  const msUntilFade = Math.max((track.duration - track.currentTime - CROSSFADE_SECONDS) * 1000, 120);
  loopTimer = setTimeout(startNextTrack, msUntilFade);
}
async function startNextTrack(){
  if (!musicOn) return;
  const fromTrack = musicTracks[activeTrack];
  activeTrack = (activeTrack + 1) % musicTracks.length;
  const toTrack = musicTracks[activeTrack];
  toTrack.currentTime = 0;
  toTrack.volume = 0;
  try {
    await toTrack.play();
    fadeTracks(fromTrack, toTrack);
    scheduleMusicLoop();
  } catch (error) {
    setSoundButton(false);
    musicOn = false;
  }
}
async function startMusic(){
  if (musicOn) return true;
  musicOn = true;
  const track = musicTracks[activeTrack];
  track.volume = MUSIC_VOLUME;
  try {
    await track.play();
    setSoundButton(true);
    scheduleMusicLoop();
    return true;
  } catch (error) {
    musicOn = false;
    setSoundButton(false);
    return false;
  }
}
function stopMusic(){
  musicOn = false;
  clearTimeout(loopTimer);
  musicTracks.forEach(track => {
    track.pause();
    track.volume = 0;
  });
  setSoundButton(false);
}
soundToggle.addEventListener("click", async () => {
  if (!musicOn) {
    await startMusic();
  } else {
    stopMusic();
  }
});
window.addEventListener("DOMContentLoaded", async () => {
  if (sessionStorage.getItem("abdzMusicRequested") === "1") {
    sessionStorage.removeItem("abdzMusicRequested");
    await startMusic();
  }
});
const FIRST_NUMBERED_FILE = 2;
const NUMBER_OF_NUMBERED_PAGES = 160;
const PANORAMA_PAGES = [12,31,52,83,88,93,110,113,114,118,119,128,133,146,157];
const imageList = [
  "couverture.png",
  ...Array.from({ length: NUMBER_OF_NUMBERED_PAGES }, (_, i) => `${FIRST_NUMBERED_FILE + i}.png`),
  "derniere-couverture.png"
];
const pagesContainer = document.getElementById("pagesContainer");
const pageNumber = document.getElementById("pageNumber");
const turnLayer = document.getElementById("turnLayer");
const stage = document.getElementById("stage");
const progressBar = document.getElementById("progressBar");
const overview = document.getElementById("overview");
const overviewGrid = document.getElementById("overviewGrid");
const overviewButton = document.getElementById("overviewButton");
const overviewClose = document.getElementById("overviewClose");
const overviewSearch = document.getElementById("overviewSearch");
const fullscreenButton = document.getElementById("fullscreenButton");
const loading = document.getElementById("loading");
const hashPage = Number.parseInt(location.hash.replace("#page-", ""), 10);
let currentPage = Number.isFinite(hashPage) ? Math.min(Math.max(hashPage - 1, 0), imageList.length - 1) : 0;
let touchStartX = 0;
let touchEndX = 0;
let pointerStartX = 0;
let pointerStartY = 0;
let isAnimating = false;

imageList.forEach((fileName, index) => {
  const page = document.createElement("div");
  page.className = "page";
  const displayNumber = index + 1;
  if (PANORAMA_PAGES.includes(displayNumber)) page.dataset.panorama = "true";
  const img = document.createElement("img");
  const source = `../ABDZ01/IMAGES/${fileName}`;
  if (index < 6 || Math.abs(index - currentPage) < 4) img.src = source;
  else img.dataset.src = source;
  img.alt = fileName;
  img.loading = index < 6 ? "eager" : "lazy";
  img.decoding = "async";
  img.draggable = false;
  page.appendChild(img);
  pagesContainer.appendChild(page);
});

const pages = Array.from(document.querySelectorAll(".page"));
const isDesktop = () => window.innerWidth >= 1024;
const isPanorama = index => pages[index]?.dataset?.panorama === "true";
const isCover = index => index === 0;
const isLastCover = index => index === imageList.length - 1;
function ensureImage(index){
  const img = pages[index]?.querySelector("img");
  if (img?.dataset?.src) {
    img.src = img.dataset.src;
    delete img.dataset.src;
  }
}
function preloadAround(index){
  for (let i = Math.max(0,index - 3); i <= Math.min(pages.length - 1,index + 5); i += 1) ensureImage(i);
}
function canPair(index){
  if (!isDesktop()) return false;
  if (index < 0 || index >= pages.length) return false;
  if (isCover(index) || isLastCover(index) || isPanorama(index)) return false;
  const nextIndex = index + 1;
  if (nextIndex >= pages.length) return false;
  if (isLastCover(nextIndex) || isPanorama(nextIndex)) return false;
  return true;
}
function getLabel(index){
  if (isCover(index)) return "Couverture";
  if (isLastCover(index)) return "Derniere couverture";
  return `Page ${index + 1}`;
}
function activeImages(){
  return Array.from(document.querySelectorAll(".page.active img"));
}
function cloneTurningPage(direction){
  const images = activeImages();
  if (!images.length) return;
  const target = direction > 0 ? images[images.length - 1] : images[0];
  const rect = target.getBoundingClientRect();
  const clone = target.cloneNode(false);
  clone.className = `turn-copy ${direction > 0 ? "next" : "prev"}`;
  clone.style.left = `${rect.left}px`;
  clone.style.top = `${rect.top}px`;
  clone.style.width = `${rect.width}px`;
  clone.style.height = `${rect.height}px`;
  turnLayer.appendChild(clone);
  clone.addEventListener("animationend", () => clone.remove(), {once:true});
}
function render(direction = 0){
  preloadAround(currentPage);
  pages.forEach(page => page.classList.remove("active"));
  pagesContainer.classList.remove("double-layout","incoming-next","incoming-prev");
  if (!pages[currentPage]) return;
  if (direction > 0) pagesContainer.classList.add("incoming-next");
  if (direction < 0) pagesContainer.classList.add("incoming-prev");
  if (isDesktop() && canPair(currentPage)) {
    pages[currentPage].classList.add("active");
    pages[currentPage + 1].classList.add("active");
    pagesContainer.classList.add("double-layout");
    pageNumber.textContent = `Pages ${currentPage + 1}-${currentPage + 2} / ${pages.length}`;
  } else {
    pages[currentPage].classList.add("active");
    pageNumber.textContent = `${getLabel(currentPage)} / ${pages.length}`;
  }
  progressBar.style.width = `${((currentPage + 1) / pages.length) * 100}%`;
  history.replaceState(null, "", `#page-${currentPage + 1}`);
  document.querySelectorAll(".thumb.current").forEach(item => item.classList.remove("current"));
  overviewGrid.children[currentPage]?.classList.add("current");
  setTimeout(() => pagesContainer.classList.remove("incoming-next","incoming-prev"), 520);
}
function goToPage(nextIndex, direction){
  if (isAnimating) return;
  if (nextIndex < 0) nextIndex = 0;
  if (nextIndex >= pages.length) {
    window.location.href = `intro.html?mode=outro${magazineFrom ? `&from=${encodeURIComponent(magazineFrom)}` : ""}`;
    return;
  }
  isAnimating = true;
  cloneTurningPage(direction);
  currentPage = nextIndex;
  render(direction);
  setTimeout(() => { isAnimating = false; }, 760);
}
function nextPage(){
  const step = isDesktop() && canPair(currentPage) ? 2 : 1;
  goToPage(currentPage + step, 1);
}
function prevPage(){
  let nextIndex;
  if (isDesktop()) {
    const previousStart = currentPage - 2;
    if (currentPage <= 0) nextIndex = 0;
    else if (previousStart >= 0 && canPair(previousStart)) nextIndex = previousStart;
    else nextIndex = currentPage - 1;
  } else {
    nextIndex = currentPage - 1;
  }
  goToPage(nextIndex, -1);
}
document.addEventListener("touchstart", e => { touchStartX = e.changedTouches[0].screenX; }, {passive:true});
document.addEventListener("touchend", e => {
  touchEndX = e.changedTouches[0].screenX;
  if (touchEndX < touchStartX - 50) nextPage();
  if (touchEndX > touchStartX + 50) prevPage();
}, {passive:true});
stage.addEventListener("pointerdown", event => {
  pointerStartX = event.clientX;
  pointerStartY = event.clientY;
});
stage.addEventListener("pointerup", event => {
  const deltaX = event.clientX - pointerStartX;
  const deltaY = event.clientY - pointerStartY;
  if (Math.abs(deltaX) > 64 && Math.abs(deltaX) > Math.abs(deltaY) * 1.25) {
    deltaX < 0 ? nextPage() : prevPage();
  }
});
document.addEventListener("keydown", event => {
  if (event.key === "ArrowRight") nextPage();
  if (event.key === "ArrowLeft") prevPage();
  if (event.key === "Escape" && overview.classList.contains("open")) closeOverview();
});
function buildOverview(){
  imageList.forEach((fileName,index) => {
    const button = document.createElement("button");
    button.className = "thumb";
    button.type = "button";
    button.dataset.index = index;
    const img = document.createElement("img");
    img.loading = "lazy";
    img.decoding = "async";
    img.src = `../ABDZ01/THUMBS/${fileName.replace(/\.png$/i,".webp")}`;
    img.alt = "";
    const label = document.createElement("span");
    label.textContent = getLabel(index);
    button.append(img,label);
    button.addEventListener("click", () => {
      const direction = index >= currentPage ? 1 : -1;
      currentPage = index;
      render(direction);
      closeOverview();
    });
    overviewGrid.appendChild(button);
  });
}
overviewSearch.addEventListener("input", () => {
  const query = overviewSearch.value.trim().toLocaleLowerCase("fr");
  const requestedPage = /^\d+$/.test(query) ? Number.parseInt(query,10) : null;
  Array.from(overviewGrid.children).forEach((button,index) => {
    const label = getLabel(index).toLocaleLowerCase("fr");
    button.hidden = requestedPage !== null
      ? index + 1 !== requestedPage
      : Boolean(query) && !label.includes(query);
  });
});
overviewSearch.addEventListener("keydown", event => {
  if (event.key !== "Enter") return;
  event.preventDefault();
  const query = overviewSearch.value.trim().toLocaleLowerCase("fr");
  const requestedPage = query === "couverture" ? 1 : Number.parseInt(query,10);
  if (!Number.isInteger(requestedPage) || requestedPage < 1 || requestedPage > pages.length) {
    overviewSearch.setCustomValidity(`Entre un numéro de 1 à ${pages.length}.`);
    overviewSearch.reportValidity();
    overviewSearch.setCustomValidity("");
    return;
  }
  const nextIndex = requestedPage - 1;
  const direction = nextIndex >= currentPage ? 1 : -1;
  currentPage = nextIndex;
  render(direction);
  closeOverview();
});
function openOverview(){
  overview.classList.add("open");
  overview.setAttribute("aria-hidden","false");
  overviewButton.setAttribute("aria-expanded","true");
  overviewSearch.value = "";
  Array.from(overviewGrid.children).forEach(button => { button.hidden = false; });
  overviewGrid.children[currentPage]?.scrollIntoView({block:"center"});
}
function closeOverview(){
  overview.classList.remove("open");
  overview.setAttribute("aria-hidden","true");
  overviewButton.setAttribute("aria-expanded","false");
  overviewButton.focus();
}
overviewButton.addEventListener("click", openOverview);
overviewClose.addEventListener("click", closeOverview);
overview.addEventListener("click", event => { if (event.target === overview) closeOverview(); });
fullscreenButton.addEventListener("click", async () => {
  try {
    if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  } catch (error) {}
});
document.addEventListener("fullscreenchange", () => {
  const active = Boolean(document.fullscreenElement);
  fullscreenButton.querySelector(".tool-icon").textContent = active ? "↙" : "⛶";
  fullscreenButton.querySelector(".tool-label").textContent = active ? "Réduire" : "Agrandir";
  fullscreenButton.setAttribute("aria-label", active ? "Quitter le plein écran" : "Passer en plein écran");
});
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("dragstart", e => e.preventDefault());
let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => render(), 120);
});
buildOverview();
render();
Promise.race([
  pages[currentPage].querySelector("img").decode().catch(() => {}),
  new Promise(resolve => setTimeout(resolve, 1600))
]).then(() => loading.classList.add("hidden"));
</script>
