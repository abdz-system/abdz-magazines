<script>
  const fileList = [
    "couverture.png",
    ...Array.from({ length: 44 }, (_, i) => `${i + 1}.png`),
    "derniere-couverture.png"
  ];

  const pagesContainer = document.getElementById("pagesContainer");

  // Pages images normales
  fileList.forEach((fileName) => {
    const page = document.createElement("div");
    page.className = "page";

    const img = document.createElement("img");
    img.src = `IMAGES/${fileName}`;
    img.alt = fileName;

    page.appendChild(img);
    pagesContainer.appendChild(page);
  });

  // 👉 Page vidéo de fermeture (ajoutée à la fin)
  const videoPage = document.createElement("div");
  videoPage.className = "page";

  videoPage.innerHTML = `
    <video id="closeVideo"
      src="VIDEOS/sphere-close.mp4"
      controls
      playsinline
      style="width:100%; max-height:85vh; border-radius:12px;">
    </video>
  `;

  pagesContainer.appendChild(videoPage);

  let currentPage = 0;

  const pages = document.querySelectorAll(".page");
  const pageNumber = document.getElementById("pageNumber");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");

  function isDesktop() {
    return window.innerWidth >= 1024;
  }

  function render() {
    const desktop = isDesktop();

    pages.forEach(p => p.classList.remove("active"));
    pagesContainer.classList.remove("double-layout");

    // Si on est sur la page vidéo
    if (currentPage === pages.length - 1) {
      pages[currentPage].classList.add("active");

      const video = document.getElementById("closeVideo");

      if (video) {
        video.currentTime = 0;
        video.play().catch(()=>{});
      }

      pageNumber.textContent = "Final / " + pages.length;

      nextBtn.style.display = "none";
      prevBtn.style.visibility = "visible";

      return;
    }

    nextBtn.style.display = "block";

    if (desktop && currentPage > 0) {
      const first = currentPage;
      const second = Math.min(currentPage + 1, pages.length - 2);

      pages[first].classList.add("active");
      pages[second].classList.add("active");

      pagesContainer.classList.add("double-layout");

      pageNumber.textContent =
        `Pages ${first + 1}–${second + 1} / ${pages.length}`;
    }
    else {
      pages[currentPage].classList.add("active");
      pageNumber.textContent =
        `Page ${currentPage + 1} / ${pages.length}`;
    }

    prevBtn.style.visibility = (currentPage === 0) ? "hidden" : "visible";
  }

  function nextPage() {

    // Si on est à la dernière image → aller à la vidéo
    if (currentPage === pages.length - 2) {
      currentPage = pages.length - 1;
      render();
      return;
    }

    if (isDesktop()) {
      if (currentPage === 0) {
        currentPage = 1;
      } else {
        currentPage += 2;
      }
    }
    else {
      currentPage++;
    }

    if (currentPage >= pages.length) currentPage = 0;

    render();
  }

  function prevPage() {

    if (currentPage === pages.length - 1) {
      currentPage = pages.length - 2;
      render();
      return;
    }

    if (isDesktop()) {
      if (currentPage === 0) {
        currentPage = pages.length - 2;
      }
      else if (currentPage === 1) {
        currentPage = 0;
      }
      else {
        currentPage -= 2;
      }
    }
    else {
      currentPage = (currentPage > 0) ? currentPage - 1 : pages.length - 1;
    }

    render();
  }

  window.addEventListener("resize", render);
  render();
</script>
