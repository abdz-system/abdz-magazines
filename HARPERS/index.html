<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HARPER’S BAZAAR — ABDZ</title>

<style>
body{font-family:Arial;background:#f2f2f2;margin:0;padding:10px}
.viewer{
max-width:1100px;margin:auto;background:white;padding:20px;
border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.15);text-align:center}
.page{display:none}
.page.active{display:block}
.page img,.page video{
width:100%;max-height:85vh;border-radius:12px;background:#000}
.nav{display:flex;gap:10px;margin-top:18px}
button{
flex:1;background:black;color:white;border:0;padding:10px;
border-radius:8px;cursor:pointer}
button:hover{background:#b30000}
</style>
</head>

<body>

<div class="viewer">

<div id="pages"></div>

<div class="nav">
<button onclick="prev()">← Précédente</button>
<button onclick="next()">Suivante →</button>
</div>

<div id="num"></div>

</div>

<audio id="bgm" loop>
<source src="AUDIOS/abdz-music.mp3">
</audio>

<script>

const bgm=document.getElementById("bgm");

function play(){
if(bgm.paused)bgm.play().catch(()=>{});
}

try{
if(localStorage.getItem("ABDZ_BGM_ON")==="1")play();
}catch(e){}

const files=[
"couverture.png",
...Array.from({length:44},(_,i)=>i+1+".png"),
"derniere-couverture.png"
];

const pages=document.getElementById("pages");

files.forEach(f=>{
let d=document.createElement("div");
d.className="page";
let i=document.createElement("img");
i.src="IMAGES/"+f;
d.appendChild(i);
pages.appendChild(d);
});

let vwrap=document.createElement("div");
vwrap.className="page";

let v=document.createElement("video");
v.src="VIDEOS/sphere-close.mp4";
v.controls=true;
v.muted=true;
v.autoplay=true;

v.addEventListener("ended",()=>{
bgm.pause();
bgm.currentTime=0;
});

vwrap.appendChild(v);
pages.appendChild(vwrap);

const list=[...document.querySelectorAll(".page")];

let cur=0;

function show(){
list.forEach(p=>p.classList.remove("active"));
list[cur].classList.add("active");
document.getElementById("num").innerText=
"Page "+(cur+1)+" / "+list.length;
}

function next(){

play();

if(cur===list.length-1){
localStorage.setItem("ABDZ_BGM_ON","0");
location.href="intro.html";
return;
}

cur++;
show();
}

function prev(){

play();

cur=cur>0?cur-1:list.length-1;
show();
}

show();

</script>

</body>
</html>
