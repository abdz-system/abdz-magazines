<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HARPER'S BAZAAR — ABDZ</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 10px;
    }

    .viewer {
      max-width: 1100px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      text-align: center;
    }

    .pages { display: block; }

    .page { display: none; }
    .page.active { display: block; }

    .page img, .page video {
      max-width: 100%;
      max-height: 85vh;
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      object-fit: contain;
      background: #000;
    }

    .nav-buttons {
      margin-top: 18px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    button {
      background: black;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      transition: 0.2s;
      flex: 1;
    }

    button:hover { background: #b30000; }

    .page-number {
      margin-top: 8px;
      font-size: 14px;
      color: #5a5a5a;
      text-align: center;
    }

    @media (max-width: 600px) {
      body { padding: 5px; }
      .viewer { padding: 12px; border-radius: 12px; }
    }

    /* 🖥 Double page uniquement sur ordi */
    @media (min-width: 1024px) {
      .pages.double-layout {
        display: flex;
        justify-content: center;
        gap: 24px;
      }

      .pages.double-layout .page.active {
        flex: 0 0 45%;
      }

      .pages.double-layout .page.active img,
      .pages.double-layout .page.active video {
        max-height: 92vh;
      }
    }
  </style>
</head>

<body>
  <div class="viewer">
    <div class="pages" id="pagesContainer"></div>

    <div class="nav-buttons">
      <button id="prevBtn" onclick="prevPage()">← Page précédente</button>
      <button id="nextBtn" onclick="nextPage()">Page suivante →</button>
    </div>

    <div class="page-number" id="pageNumber"></div>
  </div>

  <script>
    // ✅ 1) Liste des images (adapte si besoin : 44 pages)
    const imageList = [
      "couverture.png",
      ...Array.from({ length: 44 }, (_, i) => `${i + 1}.png`),
      "derniere-couverture.png"
    ];

    const pagesContainer = document.getElementById("pagesContainer");

    // ✅ Ajoute pages images
    imageList.forEach((fileName) => {
      const page = document.createElement("div");
      page.className = "page";
      page.dataset.type = "image";

      const img = document.createElement("img");
      img.src = `IMAGES/${fileName}`;
      img.alt = fileName;

      page.appendChild(img);
      pagesContainer.appendChild(page);
    });

    // ✅ 2) Ajoute page vidéo finale
    const videoPage = document.createElement("div");
    videoPage.className = "page";
    videoPage.dataset.type = "video";

    const video = document.createElement("video");
    video.src = `VIDEOS/sphere-close.mp4`;   // ✅ ton fichier dans HARPERS/VIDEOS/
    video.playsInline = true;
    video.preload = "metadata";

    // ✅ AUTOPLAY propre (la plupart des navigateurs l'acceptent si muted)
    video.muted = true;
    video.autoplay = true;

    // ✅ je laisse les contrôles pour qu'ils puissent relancer si besoin
    video.controls = true;

    videoPage.appendChild(video);
    pagesContainer.appendChild(videoPage);

    // Navigation
    let currentPage = 0;
    const pages = document.querySelectorAll(".page");
    const pageNumber = document.getElementById("pageNumber");
    const prevBtn = document.getElementById("prevBtn");

    function isDesktop() {
      return window.innerWidth >= 1024;
    }

    function stopVideos() {
      pages.forEach(p => {
        const v = p.querySelector("video");
        if (v) { v.pause(); v.currentTime = 0; }
      });
    }

    function tryPlayVideoOnActivePages() {
      document.querySelectorAll(".page.active video").forEach(v => {
        // tentative autoplay (si bloqué, l'utilisateur peut cliquer Play)
        v.play().catch(() => {});
      });
    }

    function pageType(index) {
      return pages[index]?.dataset?.type || "image";
    }

    function render() {
      const desktop = isDesktop();

      pages.forEach(p => p.classList.remove("active"));
      pagesContainer.classList.remove("double-layout");

      // ✅ Règle anti-bug : si une vidéo est concernée, on force 1 seule page (même sur ordi)
      if (desktop && currentPage > 0) {
        const first = currentPage;
        const second = Math.min(currentPage + 1, pages.length - 1);

        const firstType = pageType(first);
        const secondType = pageType(second);

        const mustSingle = (firstType === "video" || secondType === "video");

        if (mustSingle) {
          pages[first].classList.add("active");
          pageNumber.textContent = `Page ${first + 1} / ${pages.length}`;
        } else {
          pages[first].classList.add("active");
          if (second !== first) pages[second].classList.add("active");
          pagesContainer.classList.add("double-layout");
          pageNumber.textContent = `Pages ${first + 1}–${second + 1} / ${pages.length}`;
        }
      } else {
        pages[currentPage].classList.add("active");
        pageNumber.textContent = `Page ${currentPage + 1} / ${pages.length}`;
      }

      prevBtn.style.visibility = (currentPage === 0) ? "hidden" : "visible";

      // ✅ si on arrive sur la page vidéo, on lance autoplay
      tryPlayVideoOnActivePages();
    }

    function nextPage() {
      stopVideos();

      if (isDesktop()) {
        if (currentPage === 0) {
          currentPage = 1;
        } else {
          currentPage += 2;
          if (currentPage >= pages.length) currentPage = 0;
        }
      } else {
        currentPage = (currentPage === pages.length - 1) ? 0 : currentPage + 1;
      }
      render();
    }

    function prevPage() {
      stopVideos();

      if (isDesktop()) {
        if (currentPage === 0) {
          currentPage = pages.length - 2;
        } else if (currentPage === 1) {
          currentPage = 0;
        } else {
          currentPage -= 2;
        }
      } else {
        currentPage = (currentPage > 0) ? currentPage - 1 : pages.length - 1;
      }
      render();
    }

    window.addEventListener("resize", render);
    render();
  </script>
</body>
</html>
