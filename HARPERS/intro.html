<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABDZ — Porte d’ouverture</title>

<style>
  body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    color: white;
    background: radial-gradient(circle at top, #3a2d1a 0%, #000 70%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .container { max-width: 900px; padding: 20px; }
  h1 { font-size: 30px; margin-bottom: 6px; letter-spacing: 1px; }
  p.sous-titre {
    font-size: 18px; line-height: 1.4; opacity: 0.95;
    margin-bottom: 18px; font-weight: 300;
  }
  .video-wrapper {
    margin: 0 auto 18px auto;
    max-width: 800px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(0,0,0,0.5);
  }
  video {
    width: 100%;
    display: block;
    background: #000;
    max-height: 70vh;
  }
  a.cta {
    display: inline-block;
    margin-top: 6px;
    padding: 14px 28px;
    background: #b48b43;
    color: white;
    font-size: 20px;
    border-radius: 999px;
    text-decoration: none;
    transition: 0.3s;
    box-shadow: 0 8px 22px rgba(0,0,0,0.4);
    letter-spacing: 0.5px;
    font-weight: 500;
    text-transform: uppercase;
  }
  a.cta:hover { background: #d4a64d; transform: translateY(-3px); }
</style>
</head>

<body>
<div class="container">

  <h1>ABDZ : LA SPHÈRE</h1>
  <p class="sous-titre">Une porte d’entrée vers l’univers éditorial ABDZ.</p>

  <div class="video-wrapper">
    <video id="introVideo" controls playsinline preload="metadata">
      <source src="VIDEOS/sphere-abdz.mp4" type="video/mp4">
      Votre navigateur ne peut pas lire cette vidéo.
    </video>
  </div>

  <!-- Audio invisible, aucun contrôle -->
  <audio id="bgMusic" preload="auto" loop>
    <source src="AUDIOS/abdz-music.mp3" type="audio/mpeg">
  </audio>

  <a class="cta" href="index.html">ENTREZ DANS MON UNIVERS</a>

</div>

<script>
  const video = document.getElementById("introVideo");
  const music = document.getElementById("bgMusic");
  music.volume = 0.22;

  async function startMusic() {
    try { await music.play(); } catch (e) {}
  }
  function stopMusic() {
    try { music.pause(); music.currentTime = 0; } catch (e) {}
  }

  video.addEventListener("play", startMusic);
  video.addEventListener("pause", stopMusic);
  video.addEventListener("ended", stopMusic);
</script>

</body>
</html>
