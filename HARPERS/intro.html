<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ABDZ — Ouverture</title>

<style>

body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #3a2d1a 0%, #000 70%);
    color: white;

    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.container {
    max-width: 900px;
    padding: 20px;
}

h1 {
    font-size: 28px;
    margin-bottom: 8px;
}

.subtitle {
    font-size: 17px;
    opacity: 0.9;
    margin-bottom: 20px;
}

.video-box {
    max-width: 800px;
    margin: auto;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
}

video {
    width: 100%;
    background: black;
}

.button {
    margin-top: 20px;
    display: inline-block;

    padding: 14px 30px;
    background: #b48b43;
    color: white;

    text-decoration: none;
    font-size: 18px;
    border-radius: 999px;

    transition: 0.3s;
}

.button:hover {
    background: #d4a64d;
    transform: translateY(-2px);
}

</style>
</head>

<body>

<div class="container">

    <h1>ABDZ — HARPER’S BAZAAR</h1>

    <div class="subtitle">
        Cliquez pour ouvrir la sphère
    </div>

    <!-- AUDIO -->
    <audio id="bgMusic" preload="auto">
        <source src="AUDIOS/abdz-music.mp3" type="audio/mpeg">
    </audio>

    <!-- VIDEO -->
    <div class="video-box">
        <video id="introVideo" controls playsinline>
            <source src="VIDEOS/sphere-abdz.mp4" type="video/mp4">
        </video>
    </div>

    <!-- BOUTON -->
    <a class="button" href="index.html">
        Entrer dans l’univers
    </a>

</div>

<script>

const video = document.getElementById("introVideo");
const music = document.getElementById("bgMusic");

let started = false;

// Quand elle clique PLAY → musique démarre
video.addEventListener("play", () => {

    if (!started) {
        music.volume = 0.8;
        music.play().catch(()=>{});
        started = true;
    }

});

// Quand vidéo pause → musique pause
video.addEventListener("pause", () => {
    music.pause();
});

// Quand vidéo finie → musique continue doucement
video.addEventListener("ended", () => {
    music.volume = 0.4;
});

</script>

</body>
</html>
