<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABDZ — Porte d’ouverture</title>

<style>
body {
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  color:white;
  background:radial-gradient(circle at top,#3a2d1a 0%,#000 70%);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}
.container{max-width:900px;padding:20px;}
h1{font-size:30px;margin-bottom:6px;letter-spacing:1px;}
p{font-size:18px;opacity:.95;margin-bottom:18px;}
.video-wrapper{
  max-width:800px;
  margin:0 auto 18px;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 8px 25px rgba(0,0,0,.5);
}
video{width:100%;background:#000;max-height:70vh;}
a{
  display:inline-block;
  padding:14px 28px;
  background:#b48b43;
  color:white;
  font-size:20px;
  border-radius:999px;
  text-decoration:none;
}
a:hover{background:#d4a64d;}
</style>
</head>

<body>

<div class="container">

<h1>ABDZ : LA SPHÈRE HARPER’S BAZAAR</h1>
<p>Une porte d’entrée vers l’univers éditorial ABDZ.</p>

<div class="video-wrapper">
<video id="v" controls playsinline>
<source src="VIDEOS/sphere-abdz.mp4" type="video/mp4">
</video>
</div>

<a id="go" href="index.html">ENTREZ DANS MON UNIVERS</a>

</div>

<script>

function arm(){
  try{localStorage.setItem("ABDZ_BGM_ON","1");}catch(e){}
}

document.getElementById("v").addEventListener("play",arm);
document.getElementById("go").addEventListener("click",arm);

</script>

</body>
</html>
