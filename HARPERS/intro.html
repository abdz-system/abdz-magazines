<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ABDZ — Harper’s Bazaar</title>

<style>
body{
  margin:0;
  background:#000;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

.container{
  max-width:900px;
  margin:40px auto;
}

video{
  width:100%;
  max-height:80vh;
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.6);
}

a{
  display:inline-block;
  margin-top:25px;
  color:white;
  text-decoration:none;
  font-size:20px;
  border:1px solid white;
  padding:12px 22px;
  border-radius:25px;
  transition:0.3s;
}

a:hover{
  background:white;
  color:black;
}
</style>
</head>

<body>

<div class="container">

<h2>ABDZ — HARPER’S BAZAAR</h2>
<p>Cliquez pour ouvrir la sphère</p>

<!-- Vidéo -->
<video id="introVideo" controls playsinline>
  <source src="VIDEOS/sphere-abdz.mp4" type="video/mp4">
</video>

<!-- Musique cachée -->
<audio id="bgMusic" loop>
  <source src="AUDIOS/abdz-music.mp3" type="audio/mpeg">
</audio>

<br>

<a href="index.html">Entrer dans l’univers</a>

</div>

<script>

const video = document.getElementById("introVideo");
const music = document.getElementById("bgMusic");

/* Quand on clique sur Play → musique démarre */
video.addEventListener("play", () => {
  music.play().catch(()=>{});
});

/* Quand la vidéo s'arrête → musique continue */
video.addEventListener("ended", () => {
  music.volume = 0.7;
});

</script>

</body>
</html>
