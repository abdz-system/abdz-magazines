<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABDZ01 â€” Vivant Test</title>
<link rel="icon" type="image/png" href="../ABDZ01/IMAGES/favicon.png">
<style>
*{box-sizing:border-box}
:root{
  --gold:#d6a94d;
  --gold-strong:#ffd782;
  --gold-soft:rgba(214,169,77,.42);
  --panel:rgba(8,8,8,.78);
}
html,body{height:100%}
body{
  margin:0;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 50% 38%, rgba(108,72,28,.38), transparent 34%),
    radial-gradient(circle at 50% 100%, rgba(214,169,77,.09), transparent 36%),
    linear-gradient(115deg,#030303 0%,#15110a 45%,#050505 100%);
  color:#fff;
}
.viewer{
  position:fixed;
  inset:0;
  display:grid;
  grid-template-rows:1fr auto;
  padding:12px;
}
.stage{
  position:relative;
  display:grid;
  place-items:center;
  min-height:0;
  perspective:2100px;
  overflow:hidden;
}
.stage::before{
  content:"";
  position:absolute;
  inset:5% 15%;
  background:radial-gradient(circle, rgba(214,169,77,.18), transparent 62%);
  filter:blur(18px);
  pointer-events:none;
}
.pages{
  position:relative;
  z-index:2;
  display:grid;
  place-items:center;
  width:100%;
  height:100%;
}
.pages.double-layout{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:18px;
}
.page{
  display:none;
  position:relative;
  min-width:0;
  min-height:0;
  transform-style:preserve-3d;
}
.page.active{
  display:grid;
  place-items:center;
}
.pages.double-layout .page.active{
  flex:0 1 min(46vw, calc(90svh * 0.714));
}
.page img{
  display:block;
  width:auto;
  height:auto;
  max-width:100%;
  max-height:88svh;
  object-fit:contain;
  object-position:center center;
  border-radius:10px;
  background:#000;
  box-shadow:0 20px 42px rgba(0,0,0,.42), 0 0 18px rgba(214,169,77,.12);
  backface-visibility:hidden;
  transform:translateZ(0);
}
.pages.double-layout .page img{
  max-height:90svh;
}
.page::after{
  content:"Â© ABDZ CreationsÂ®";
  position:absolute;
  right:10px;
  bottom:8px;
  font-size:10px;
  color:rgba(255,255,255,.48);
  pointer-events:none;
}
.turn-layer{
  position:fixed;
  inset:0;
  z-index:14;
  pointer-events:none;
  perspective:2100px;
}
.turn-copy{
  position:fixed;
  object-fit:contain;
  border-radius:10px;
  background:#000;
  box-shadow:0 28px 58px rgba(0,0,0,.55), 0 0 34px rgba(214,169,77,.22);
  transform-style:preserve-3d;
  backface-visibility:hidden;
}
.turn-copy.next{
  transform-origin:left center;
  animation:pageLeaveNext .58s cubic-bezier(.28,.04,.18,1) both;
}
.turn-copy.prev{
  transform-origin:right center;
  animation:pageLeavePrev .58s cubic-bezier(.28,.04,.18,1) both;
}
.incoming-next .page.active img{
  animation:pageArriveNext .48s cubic-bezier(.25,.06,.18,1) both;
}
.incoming-prev .page.active img{
  animation:pageArrivePrev .48s cubic-bezier(.25,.06,.18,1) both;
}
@keyframes pageLeaveNext{
  0%{opacity:1; transform:rotateY(0) translateX(0) scale(1); filter:brightness(1)}
  48%{opacity:.82; transform:rotateY(-38deg) translateX(-16px) scale(.985); filter:brightness(.78)}
  100%{opacity:0; transform:rotateY(-74deg) translateX(-46px) scale(.965); filter:brightness(.48)}
}
@keyframes pageLeavePrev{
  0%{opacity:1; transform:rotateY(0) translateX(0) scale(1); filter:brightness(1)}
  48%{opacity:.82; transform:rotateY(38deg) translateX(16px) scale(.985); filter:brightness(.78)}
  100%{opacity:0; transform:rotateY(74deg) translateX(46px) scale(.965); filter:brightness(.48)}
}
@keyframes pageArriveNext{
  0%{opacity:.58; transform:translateX(22px) scale(.985); filter:brightness(.72)}
  100%{opacity:1; transform:translateX(0) scale(1); filter:brightness(1)}
}
@keyframes pageArrivePrev{
  0%{opacity:.58; transform:translateX(-22px) scale(.985); filter:brightness(.72)}
  100%{opacity:1; transform:translateX(0) scale(1); filter:brightness(1)}
}
.nav{
  position:absolute;
  top:50%;
  z-index:24;
  width:48px;
  height:60px;
  transform:translateY(-50%);
  border:1px solid rgba(255,215,130,.78);
  border-radius:999px;
  background:rgba(18,18,18,.70);
  color:#ffe7b1;
  font-size:34px;
  line-height:1;
  display:grid;
  place-items:center;
  box-shadow:0 0 25px rgba(214,169,77,.26), inset 0 0 16px rgba(255,230,170,.08);
  cursor:pointer;
}
.nav:hover{
  background:rgba(54,35,12,.84);
  box-shadow:0 0 32px rgba(255,210,120,.36), inset 0 0 16px rgba(255,230,170,.12);
}
.nav.prev{left:max(12px,env(safe-area-inset-left))}
.nav.next{right:max(12px,env(safe-area-inset-right))}
.controls{
  position:relative;
  z-index:12;
  display:flex;
  justify-content:center;
  align-items:center;
  padding-top:8px;
}
.page-number{
  border:1px solid var(--gold-soft);
  border-radius:999px;
  background:var(--panel);
  color:#f4e3bb;
  min-height:38px;
  padding:9px 18px;
  font-size:13px;
  min-width:168px;
  text-align:center;
}

@media (min-width:1024px){
  .viewer{padding:14px 72px 12px}
  .nav.prev{left:max(18px,calc(50% - min(46vw, calc(90svh * 0.714)) - 92px))}
  .nav.next{right:max(18px,calc(50% - min(46vw, calc(90svh * 0.714)) - 92px))}
}
@media (max-width:1023px){
  .viewer{padding:10px 10px 12px}
  .page.active{
    width:100%;
    height:100%;
  }
  .page img{
    max-width:96vw;
    max-height:84svh;
  }
  .nav{
    width:42px;
    height:52px;
    font-size:30px;
    background:rgba(18,18,18,.56);
  }
}
</style>
</head>
<body>
<main class="viewer">
  <section class="stage" id="stage" aria-label="ABDZ Magazine page-turn vivant">
    <div class="pages" id="pagesContainer"></div>
    <div class="turn-layer" id="turnLayer" aria-hidden="true"></div>
    <button class="nav prev" type="button" onclick="prevPage()" aria-label="Page prÃ©cÃ©dente">â€¹</button>
    <button class="nav next" type="button" onclick="nextPage()" aria-label="Page suivante">â€º</button>
  </section>
  <footer class="controls">
    <div class="page-number" id="pageNumber"></div>
  </footer>
</main>
<script>
const FIRST_NUMBERED_FILE = 2;
const NUMBER_OF_NUMBERED_PAGES = 160;
const PANORAMA_PAGES = [12,31,52,83,88,93,110,113,114,118,119,128,133,146,157];
const imageList = [
  "couverture.png",
  ...Array.from({ length: NUMBER_OF_NUMBERED_PAGES }, (_, i) => `${FIRST_NUMBERED_FILE + i}.png`),
  "derniere-couverture.png"
];
const pagesContainer = document.getElementById("pagesContainer");
const pageNumber = document.getElementById("pageNumber");
const turnLayer = document.getElementById("turnLayer");
let currentPage = 0;
let touchStartX = 0;
let touchEndX = 0;
let isAnimating = false;

imageList.forEach((fileName, index) => {
  const page = document.createElement("div");
  page.className = "page";
  const displayNumber = index + 1;
  if (PANORAMA_PAGES.includes(displayNumber)) page.dataset.panorama = "true";
  const img = document.createElement("img");
  img.src = `../ABDZ01/IMAGES/${fileName}`;
  img.alt = fileName;
  img.loading = index < 6 ? "eager" : "lazy";
  img.decoding = "async";
  img.draggable = false;
  page.appendChild(img);
  pagesContainer.appendChild(page);
});

const pages = Array.from(document.querySelectorAll(".page"));
const isDesktop = () => window.innerWidth >= 1024;
const isPanorama = index => pages[index]?.dataset?.panorama === "true";
const isCover = index => index === 0;
const isLastCover = index => index === imageList.length - 1;
function canPair(index){
  if (!isDesktop()) return false;
  if (index < 0 || index >= pages.length) return false;
  if (isCover(index) || isLastCover(index) || isPanorama(index)) return false;
  const nextIndex = index + 1;
  if (nextIndex >= pages.length) return false;
  if (isLastCover(nextIndex) || isPanorama(nextIndex)) return false;
  return true;
}
function getLabel(index){
  if (isCover(index)) return "Couverture";
  if (isLastCover(index)) return "DerniÃ¨re couverture";
  return `Page ${index + 1}`;
}
function activeImages(){
  return Array.from(document.querySelectorAll(".page.active img"));
}
function cloneTurningPage(direction){
  const images = activeImages();
  if (!images.length) return;
  const target = direction > 0 ? images[images.length - 1] : images[0];
  const rect = target.getBoundingClientRect();
  const clone = target.cloneNode(false);
  clone.className = `turn-copy ${direction > 0 ? "next" : "prev"}`;
  clone.style.left = `${rect.left}px`;
  clone.style.top = `${rect.top}px`;
  clone.style.width = `${rect.width}px`;
  clone.style.height = `${rect.height}px`;
  turnLayer.appendChild(clone);
  clone.addEventListener("animationend", () => clone.remove(), {once:true});
}
function render(direction = 0){
  pages.forEach(page => page.classList.remove("active"));
  pagesContainer.classList.remove("double-layout","incoming-next","incoming-prev");
  if (!pages[currentPage]) return;
  if (direction > 0) pagesContainer.classList.add("incoming-next");
  if (direction < 0) pagesContainer.classList.add("incoming-prev");
  if (isDesktop() && canPair(currentPage)) {
    pages[currentPage].classList.add("active");
    pages[currentPage + 1].classList.add("active");
    pagesContainer.classList.add("double-layout");
    pageNumber.textContent = `Pages ${currentPage + 1}-${currentPage + 2} / ${pages.length}`;
  } else {
    pages[currentPage].classList.add("active");
    pageNumber.textContent = `${getLabel(currentPage)} / ${pages.length}`;
  }
  setTimeout(() => pagesContainer.classList.remove("incoming-next","incoming-prev"), 520);
}
function goToPage(nextIndex, direction){
  if (isAnimating) return;
  if (nextIndex < 0) nextIndex = 0;
  if (nextIndex >= pages.length) {
    window.location.href = "intro.html?mode=outro";
    return;
  }
  isAnimating = true;
  cloneTurningPage(direction);
  currentPage = nextIndex;
  render(direction);
  setTimeout(() => { isAnimating = false; }, 620);
}
function nextPage(){
  const step = isDesktop() && canPair(currentPage) ? 2 : 1;
  goToPage(currentPage + step, 1);
}
function prevPage(){
  let nextIndex;
  if (isDesktop()) {
    const previousStart = currentPage - 2;
    if (currentPage <= 0) nextIndex = 0;
    else if (previousStart >= 0 && canPair(previousStart)) nextIndex = previousStart;
    else nextIndex = currentPage - 1;
  } else {
    nextIndex = currentPage - 1;
  }
  goToPage(nextIndex, -1);
}
document.addEventListener("touchstart", e => { touchStartX = e.changedTouches[0].screenX; }, {passive:true});
document.addEventListener("touchend", e => {
  touchEndX = e.changedTouches[0].screenX;
  if (touchEndX < touchStartX - 50) nextPage();
  if (touchEndX > touchStartX + 50) prevPage();
}, {passive:true});
document.addEventListener("keydown", event => {
  if (event.key === "ArrowRight") nextPage();
  if (event.key === "ArrowLeft") prevPage();
});
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("dragstart", e => e.preventDefault());
window.addEventListener("resize", () => render());
render();
</script>
</body>
</html>
