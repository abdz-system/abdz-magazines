<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABDZ Magazine</title>

<style>

*{box-sizing:border-box;}

body{
margin:0;
padding:10px;
font-family:Arial,sans-serif;
background:radial-gradient(circle at top,#2e2315 0%,#111 45%,#000 100%);
color:#fff;
}

.viewer{
max-width:1200px;
margin:auto;
background:#111;
padding:20px;
border-radius:20px;
text-align:center;
}

.page{
display:none;
}

.page.active{
display:block;
}

.page img,
.page video{
width:100%;
max-height:85vh;
object-fit:contain;
border-radius:12px;
}

.pages.double{
display:flex;
gap:20px;
}

.pages.double .page{
flex:1;
}

.nav{
margin-top:20px;
display:flex;
justify-content:space-between;
}

button{
padding:12px 18px;
border:none;
background:#222;
color:#fff;
cursor:pointer;
border-radius:8px;
}

.page-number{
margin-top:10px;
}

</style>
</head>

<body>

<div class="viewer">

<div class="pages" id="pages"></div>

<div class="nav">
<button onclick="prev()">← Page précédente</button>
<button onclick="next()">Page suivante →</button>
</div>

<div class="page-number" id="num"></div>

</div>

<script>

const PANORAMA=[
12,31,52,83,88,93,110,113,114,118,119,128,133,146,157
];

const pagesContainer=document.getElementById("pages");

const images=[
"couverture.png",
...Array.from({length:160},(_,i)=>`${i+2}.png`),
"derniere-couverture.png"
];

images.forEach((img,i)=>{

let page=document.createElement("div");
page.className="page";

if(PANORAMA.includes(i+1)){
page.dataset.panorama="true";
}

let im=document.createElement("img");
im.src="IMAGES/"+img;

page.appendChild(im);
pagesContainer.appendChild(page);

});

let videoPage=document.createElement("div");
videoPage.className="page";

let v=document.createElement("video");
v.src="VIDEOS/sphere-close.mp4";
v.controls=true;

videoPage.appendChild(v);
pagesContainer.appendChild(videoPage);

const pages=document.querySelectorAll(".page");
const num=document.getElementById("num");

let current=0;

function desktop(){
return window.innerWidth>1000;
}

function pano(i){
return pages[i]?.dataset.panorama==="true";
}

function render(){

pages.forEach(p=>p.classList.remove("active"));
pagesContainer.classList.remove("double");

if(desktop()){

if(pano(current)){
pages[current].classList.add("active");
num.textContent="Page "+(current+1);
}
else{

pages[current].classList.add("active");
pages[current+1]?.classList.add("active");

pagesContainer.classList.add("double");

num.textContent="Pages "+(current+1)+"-"+(current+2);
}

}

else{

pages[current].classList.add("active");
num.textContent="Page "+(current+1);

}

}

function next(){

if(desktop()){
current+=pano(current)?1:2;
}
else{
current+=1;
}

if(current>=pages.length)current=pages.length-1;

render();

}

function prev(){

if(desktop()){
current-=pano(current)?1:2;
}
else{
current-=1;
}

if(current<0)current=0;

render();

}

window.addEventListener("resize",render);

render();

</script>

</body>
</html>
