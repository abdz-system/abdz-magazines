<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABDZ01 — ABDZ</title>

<style>

body{
margin:0;
padding:10px;
font-family:Arial,sans-serif;
background:radial-gradient(circle at top,#2e2315 0%,#111 45%,#000 100%);
color:white;
}

.viewer{
max-width:1200px;
margin:auto;
background:rgba(20,20,20,0.92);
border:1px solid rgba(212,166,77,0.25);
padding:20px;
border-radius:22px;
box-shadow:0 14px 40px rgba(0,0,0,0.35);
text-align:center;
}

.page{
display:none;
}

.page.active{
display:block;
}

.page img{
width:100%;
max-height:90vh;
object-fit:contain;
border-radius:14px;
}

.nav-buttons{
margin-top:20px;
display:flex;
gap:10px;
}

button{
flex:1;
padding:12px;
background:#111;
color:#f4e3bb;
border:1px solid rgba(212,166,77,0.45);
border-radius:10px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="viewer">

<div id="pageContainer"></div>

<div class="nav-buttons">
<button onclick="prevPage()">← Page précédente</button>
<button onclick="nextPage()">Page suivante →</button>
</div>

</div>

<script>

const images = [

"couverture.png",

...Array.from({length:160},(_,i)=>`${i+2}.png`),

"derniere-couverture.png"

];

const container = document.getElementById("pageContainer");

images.forEach(src=>{
const div=document.createElement("div");
div.className="page";

const img=document.createElement("img");
img.src="IMAGES/"+src;

div.appendChild(img);
container.appendChild(div);
});

const pages=document.querySelectorAll(".page");
let current=0;

function render(){
pages.forEach(p=>p.classList.remove("active"));
pages[current].classList.add("active");
}

function nextPage(){
if(current<pages.length-1){
current++;
render();
}
}

function prevPage(){
if(current>0){
current--;
render();
}
}

render();

</script>

</body>
</html>
