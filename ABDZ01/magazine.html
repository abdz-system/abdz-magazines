<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ABDZ01 — ABDZ</title>

<style>
*{box-sizing:border-box;}

body{
margin:0;
padding:10px;
font-family:Arial,sans-serif;
background:radial-gradient(circle at top,#2e2315 0%,#111 45%,#000 100%);
color:#fff;
}

.viewer{
max-width:1200px;
margin:0 auto;
background:rgba(20,20,20,0.92);
border:1px solid rgba(212,166,77,0.25);
padding:20px;
border-radius:22px;
box-shadow:0 14px 40px rgba(0,0,0,0.35);
text-align:center;
backdrop-filter:blur(6px);
}

.pages{
display:block;
}

.page{
display:none;
}

.page.active{
display:block;
}

.page img,
.page video{
max-width:100%;
max-height:85vh;
width:100%;
height:auto;
border-radius:14px;
box-shadow:0 14px 28px rgba(0,0,0,0.28);
object-fit:contain;
background:#000;
}

.nav-buttons{
margin-top:20px;
display:flex;
justify-content:space-between;
gap:12px;
}

button{
flex:1;
background:linear-gradient(180deg,#1d1d1d 0%,#000 100%);
color:#f4e3bb;
padding:12px 20px;
border:1px solid rgba(212,166,77,0.45);
border-radius:10px;
cursor:pointer;
font-size:15px;
transition:0.25s ease;
}

button:hover{
background:linear-gradient(180deg,#3a2a12 0%,#161616 100%);
transform:translateY(-1px);
}

.page-number{
margin-top:12px;
font-size:14px;
color:#d8c08a;
text-align:center;
letter-spacing:0.3px;
}

@media (min-width:1024px){

.pages.double-layout{
display:flex;
justify-content:center;
gap:24px;
}

.pages.double-layout .page.active{
flex:0 0 45%;
}

.pages.double-layout .page.active img{
max-height:92vh;
}

}

</style>
</head>

<body>

<div class="viewer">
<div class="pages" id="pagesContainer"></div>

<div class="nav-buttons">
<button onclick="prevPage()">← Page précédente</button>
<button onclick="nextPage()">Page suivante →</button>
</div>

<div class="page-number" id="pageNumber"></div>
</div>

<audio id="bgm" preload="auto" loop>
<source src="AUDIOS/abdz-music.mp3" type="audio/mpeg">
</audio>

<script>

const FIRST_NUMBERED_PAGE = 2;
const NUMBER_OF_NUMBERED_PAGES = 160;

const PANORAMA_PAGES = [
12,31,52,83,88,93,110,113,114,118,119,128,133,146,157
];

const bgm = document.getElementById("bgm");

function startBgm(){
if(bgm && bgm.paused){
bgm.play().catch(()=>{});
}
}

const imageList=[
"couverture.png",
...Array.from(
{length:NUMBER_OF_NUMBERED_PAGES},
(_,i)=>`${FIRST_NUMBERED_PAGE+i}.png`
),
"derniere-couverture.png"
];

const pagesContainer=document.getElementById("pagesContainer");

imageList.forEach((fileName,index)=>{

const page=document.createElement("div");
page.className="page";

const realNumber=index+1;

if(PANORAMA_PAGES.includes(realNumber)){
page.dataset.panorama="true";
}

const img=document.createElement("img");
img.src=`IMAGES/${fileName}`;
img.loading="eager";

page.appendChild(img);
pagesContainer.appendChild(page);

});

const videoPage=document.createElement("div");
videoPage.className="page";
videoPage.dataset.type="video";

const video=document.createElement("video");
video.src="VIDEOS/sphere-close.mp4";
video.controls=true;
video.autoplay=true;
video.muted=true;

videoPage.appendChild(video);
pagesContainer.appendChild(videoPage);

let currentPage=0;

const pages=document.querySelectorAll(".page");
const pageNumber=document.getElementById("pageNumber");

function isDesktop(){
return window.innerWidth>=1024;
}

function isPanorama(i){
return pages[i]?.dataset?.panorama==="true";
}

function render(){

const desktop=isDesktop();

pages.forEach(p=>p.classList.remove("active"));
pagesContainer.classList.remove("double-layout");

if(desktop){

if(isPanorama(currentPage)){

pages[currentPage].classList.add("active");

pageNumber.textContent=`Page ${currentPage+1}`;

}else{

const first=currentPage;
const second=currentPage+1;

if(isPanorama(second)){

pages[first].classList.add("active");

pageNumber.textContent=`Page ${first+1}`;

}else{

pages[first].classList.add("active");
pages[second]?.classList.add("active");

pagesContainer.classList.add("double-layout");

pageNumber.textContent=`Pages ${first+1}-${second+1}`;

}

}

}else{

pages[currentPage].classList.add("active");
pageNumber.textContent=`Page ${currentPage+1}`;

}

}

function nextPage(){

startBgm();

if(isDesktop()){

if(isPanorama(currentPage)){
currentPage+=1;
}else{
currentPage+=2;
}

}else{
currentPage+=1;
}

if(currentPage>=pages.length){
currentPage=pages.length-1;
}

render();

}

function prevPage(){

if(isDesktop()){

if(isPanorama(currentPage)){
currentPage-=1;
}else{
currentPage-=2;
}

}else{
currentPage-=1;
}

if(currentPage<0){
currentPage=0;
}

render();

}

window.addEventListener("resize",render);

render();

</script>

</body>
</html>
