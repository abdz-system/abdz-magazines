<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ABDZ01 — Flipbook Test</title>
<link rel="icon" type="image/png" href="../ABDZ01/IMAGES/favicon.png">

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  padding:20px;
  font-family:Arial,sans-serif;
  background:radial-gradient(circle at top,#2e2315 0%,#111 45%,#000 100%);
  color:#fff;
}

.viewer{
  max-width:1200px;
  margin:0 auto;
  background:rgba(20,20,20,0.92);
  border:1px solid rgba(212,166,77,0.25);
  padding:24px;
  border-radius:22px;
  box-shadow:0 14px 40px rgba(0,0,0,0.35);
  text-align:center;
  backdrop-filter:blur(6px);
}

h1{
  margin:0 0 18px 0;
  font-size:28px;
  color:#f4e3bb;
  letter-spacing:0.5px;
}

.book-wrap{
  display:flex;
  justify-content:center;
  align-items:center;
  perspective:2200px;
  min-height:78vh;
  overflow:hidden;
}

.book{
  position:relative;
  width:min(90vw, 900px);
  height:min(78vh, 640px);
  transform-style:preserve-3d;
}

.page{
  position:absolute;
  inset:0;
  transform-origin:left center;
  transform-style:preserve-3d;
  transition:transform 1s cubic-bezier(.22,.61,.36,1), z-index 0s linear .5s;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 14px 28px rgba(0,0,0,0.30);
  background:#111;
  border:1px solid rgba(212,166,77,0.18);
}

.page img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  background:#000;
  user-select:none;
  pointer-events:none;
}

.page::after{
  content:"© ABDZ Creations®";
  position:absolute;
  bottom:10px;
  right:14px;
  font-size:11px;
  color:rgba(255,255,255,0.58);
  pointer-events:none;
}

.page.flipped{
  transform:rotateY(-180deg);
}

.page.shadow::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to right, rgba(0,0,0,.35), rgba(0,0,0,0) 18%, rgba(0,0,0,0) 82%, rgba(0,0,0,.18));
  pointer-events:none;
  z-index:2;
}

.nav-buttons{
  margin-top:22px;
  display:flex;
  justify-content:space-between;
  gap:12px;
}

button{
  flex:1;
  background:linear-gradient(180deg,#1d1d1d 0%,#000 100%);
  color:#f4e3bb;
  padding:12px 20px;
  border:1px solid rgba(212,166,77,0.45);
  border-radius:10px;
  cursor:pointer;
  font-size:15px;
  transition:0.25s ease;
}

button:hover{
  background:linear-gradient(180deg,#3a2a12 0%,#161616 100%);
  transform:translateY(-1px);
}

.page-number{
  margin-top:14px;
  font-size:14px;
  color:#d8c08a;
  letter-spacing:0.3px;
  min-height:18px;
}

.note{
  margin-top:8px;
  font-size:13px;
  color:rgba(255,255,255,0.62);
}

@media (max-width:768px){
  body{padding:12px;}
  .viewer{padding:16px;border-radius:16px;}
  .book{height:min(72vh, 560px);}
  h1{font-size:22px;}
}
</style>
</head>

<body>

<div class="viewer">
  <h1>ABDZ — Test pages qui tournent</h1>

  <div class="book-wrap">
    <div class="book" id="book"></div>
  </div>

  <div class="nav-buttons">
    <button type="button" onclick="prevPage()">← Page précédente</button>
    <button type="button" onclick="nextPage()">Page suivante →</button>
  </div>

  <div class="page-number" id="pageNumber"></div>
  <div class="note">Test sur 4 pages seulement</div>
</div>

<script>
const imageList = [
  "couverture.png",
  "2.png",
  "3.png",
  "derniere-couverture.png"
];

const book = document.getElementById("book");
const pageNumber = document.getElementById("pageNumber");

let currentIndex = 0;
let isAnimating = false;

imageList.forEach((fileName, index) => {
  const page = document.createElement("div");
  page.className = "page shadow";
  page.style.zIndex = String(imageList.length - index);

  const img = document.createElement("img");
  img.src = `../ABDZ01/IMAGES/${fileName}`;
  img.alt = fileName;
  img.draggable = false;

  page.appendChild(img);
  book.appendChild(page);
});

const pages = Array.from(document.querySelectorAll(".page"));

function updateCounter(){
  pageNumber.textContent = `Page ${currentIndex + 1} / ${imageList.length}`;
}

function nextPage(){
  if (isAnimating) return;

  if (currentIndex >= pages.length - 1) {
    window.location.href = "intro-test.html?mode=outro";
    return;
  }

  isAnimating = true;
  pages[currentIndex].classList.add("flipped");
  currentIndex += 1;
  updateCounter();

  setTimeout(() => {
    isAnimating = false;
  }, 1000);
}

function prevPage(){
  if (isAnimating) return;
  if (currentIndex <= 0) return;

  isAnimating = true;
  currentIndex -= 1;
  pages[currentIndex].classList.remove("flipped");
  updateCounter();

  setTimeout(() => {
    isAnimating = false;
  }, 1000);
}

document.addEventListener("keydown", (event) => {
  if (event.key === "ArrowRight") nextPage();
  if (event.key === "ArrowLeft") prevPage();
});

let touchStartX = 0;
let touchEndX = 0;

document.addEventListener("touchstart", e => {
  touchStartX = e.changedTouches[0].screenX;
}, { passive:true });

document.addEventListener("touchend", e => {
  touchEndX = e.changedTouches[0].screenX;
  if (touchEndX < touchStartX - 50) nextPage();
  if (touchEndX > touchStartX + 50) prevPage();
}, { passive:true });

document.addEventListener("contextmenu", function(e){
  e.preventDefault();
});

document.addEventListener("dragstart", function(e){
  e.preventDefault();
});

updateCounter();
</script>

</body>
</html>
